#     targetPort: 80
#     protocol: TCP
#     nodePort: 30080


apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      volumes:
      - name: html
        emptyDir: {}
      - name: logs
        emptyDir: {}

      initContainers:
      # 1) Init container: prepares the web page
      - name: setup-content
        image: busybox:1.36
        command: ['sh', '-c', 'echo "<h1>Hello from init container, pod: $HOSTNAME</h1>" > /work/index.html']
        volumeMounts:
        - name: html
          mountPath: /work
        resources:
          requests: {cpu: "10m", memory: "8Mi"}
          limits:   {cpu: "50m", memory: "16Mi"}

      # 2) Init container: waits until DNS works
      - name: check-dns
        image: busybox:1.36
        command: ['sh', '-c', 'until nslookup webapp-svc.default.svc.cluster.local; do echo "waiting for dns"; sleep 2; done']
        resources:
          requests: {cpu: "10m", memory: "8Mi"}
          limits:   {cpu: "50m", memory: "16Mi"}

      # 3) Sidecar (native): init container with restartPolicy: Always
      - name: log-shipper
        image: busybox:1.36
        restartPolicy: Always
        command: ['sh', '-c', 'tail -n+1 -F /var/log/nginx/access.log']
        volumeMounts:
        - name: logs
          mountPath: /var/log/nginx
        resources:
          requests: {cpu: "10m", memory: "8Mi"}
          limits:   {cpu: "50m", memory: "16Mi"}

      containers:
      # 4) Main container
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: html
          mountPath: /usr/share/nginx/html
        - name: logs
          mountPath: /var/log/nginx
        resources:
          requests: {cpu: "20m", memory: "32Mi"}
          limits:   {cpu: "100m", memory: "64Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
  namespace: default
spec:
  selector:
    app: webapp
  ports:
  - port: 8080
    targetPort: 80
    nodePort: 30080
  type: NodePort