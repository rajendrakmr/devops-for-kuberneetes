<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My S3 Static Website</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #f4f7fb;
      color: #333;
    }

    header {
      background-color: #232f3e;
      color: white;
      padding: 20px;
      text-align: center;
    }

    main {
      text-align: center;
      padding: 100px 20px;
    }

    h1 {
      font-size: 42px;
      margin-bottom: 20px;
    }

    p {
      font-size: 18px;
      color: #666;
      margin-bottom: 30px;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background-color: #ff9900;
      color: white;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
    }

    .btn:hover {
      background-color: #e88b00;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      background-color: #232f3e;
      color: white;
      text-align: center;
      padding: 15px;
    }
  </style>
</head>

<body>

  <header>
    <h2>My AWS S3 Website</h2>
  </header>

  <main>
    <h1>Welcome to My Static Website 🚀</h1>

    <p>
      This website is hosted using Amazon S3 Static Website Hosting.
    </p>

    <a href="#" class="btn">Get Started</a>
  </main>

  <footer>
    <p>© 2026 My S3 Static Website | Hosted on AWS S3</p>
  </footer>

</body>
</html>
