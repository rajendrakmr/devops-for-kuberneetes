apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3-demo
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: s3-demo
  template:
    metadata:
      labels:
        app: s3-demo
    spec:
      volumes:
      - name: config
        emptyDir: {}

      initContainers: 
      - name: fetch-config
        image: amazon/aws-cli:2.17.0
        command: ['sh', '-c', 'aws s3 sync s3://demo-config-secrets/site /config && echo "initial download done" && ls -l /config']
        envFrom:
        - secretRef:
            name: aws-creds
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests: {cpu: "50m", memory: "64Mi"}
          limits:   {cpu: "200m", memory: "128Mi"}

      # SIDECAR: keeps running, re-syncs every 60s
      - name: config-sync
        image: amazon/aws-cli:2.17.0
        restartPolicy: Always
        command: ['sh', '-c', 'while true; do aws s3 sync s3://demo-config-secrets/site /config --delete; sleep 60; done']
        envFrom:
        - secretRef:
            name: aws-creds
        volumeMounts:
        - name: config
          mountPath: /config
        resources:
          requests: {cpu: "20m", memory: "64Mi"}
          limits:   {cpu: "100m", memory: "128Mi"}

      containers:
      # MAIN: serves whatever is in /config
      - name: nginx
        image: nginx:1.27
        ports:
        - containerPort: 80
        volumeMounts:
        - name: config
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests: {cpu: "20m", memory: "32Mi"}
          limits:   {cpu: "100m", memory: "64Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: s3-demo-svc
spec:
  selector:
    app: s3-demo
  ports:
  - port: 8080
    targetPort: 80
    nodePort: 30080
  type: NodePort