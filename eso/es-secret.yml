apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-secret
  namespace: default
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: mysql-secret
    creationPolicy: Owner
    template:
      data:
        MYSQL_ROOT_PASSWORD: "{{ .password }}"
        MYSQL_PASSWORD: "{{ .password }}"
  data:
  - secretKey: password
    remoteRef:
      key: prod/shop/db
      property: password