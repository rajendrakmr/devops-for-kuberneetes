apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  
  replicas: 11
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      tolerations:
        - key: "dedicated"
          operator: "Exists"
          effect: "NoSchedule"
        - key: "prd"
          operator: "Equal"
          value: "karo"
          effect: "NoSchedule"
      # tolerations:
      # - key: "dedicated"
      #   operator: "Equal"
      #   value: "gpu"
      #   effect: "NoSchedule"
      containers:
      - name: web
        image: nginx:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 80
