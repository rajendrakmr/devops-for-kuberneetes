apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: dev
spec:
  replicas: 30
  selector:
    matchLabels: {app: shop-api}
  template:
    metadata:
      labels: {app: shop-api}
    spec:
      containers:
      - name: api
        image: nginx:1.27
        resources:
          requests: {cpu: "100m", memory: "128Mi"}
          limits:   {cpu: "500m", memory: "256Mi"}      # Burstable