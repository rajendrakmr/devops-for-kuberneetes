apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: stg
spec:
  replicas: 50
  selector:
    matchLabels: {app: shop-api}
  template:
    metadata:
      labels: {app: shop-api}
    spec:
      containers:
      - name: api
        image: nginx:1.27
        resources:
          requests: {cpu: "250m", memory: "256Mi"}
          limits:   {cpu: "1",    memory: "512Mi"}      # Burstable