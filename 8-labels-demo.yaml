apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  labels:
    app: web 
  annotations:
    description: "Frontend nginx for the demo"
    owner: "team-a"
spec:
  selector:
    matchLabels:
      app: nginx
      tier: frontend
  template:
    metadata:
      labels:
        app: nginx 
        tier: frontend
        env: dev
      annotations:
        prometheus.io/scrape: "true"        # read by tools, never selected on
        build: "nginx-1.27-2026-11-05"
    spec:
      containers:
      - name: nginx
        image: nginx:1.27
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "250m"
        ports:
        - containerPort: 80


---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
      tier: backend
  template:
    metadata:
      labels:
        app: api
        tier: backend
        env: dev
    spec:
      containers:
      - name: api
        image: nginx:1.27


--- 
apiVersion: v1
kind: Service
metadata:
  name: web-svc
  annotations:
    description: "ClusterIP for the frontend"
spec:
  type: ClusterIP
  selector:
    app: nginx
    tier: frontend
  ports:
  - port: 80
    targetPort: 80