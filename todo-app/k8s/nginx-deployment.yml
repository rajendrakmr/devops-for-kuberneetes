apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: todo-ns
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
          requests:
            memory: "64Mi"
            cpu: "100m"
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: nginx-svc
  namespace: todo-ns
spec:
  selector:
    app: nginx
  ports:
  - port: 8002
    targetPort: 80
